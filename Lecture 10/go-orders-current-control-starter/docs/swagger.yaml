basePath: /
definitions:
  handler.errorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  order.CreateOrderInput:
    properties:
      items:
        items:
          $ref: '#/definitions/order.Item'
        type: array
    type: object
  order.Item:
    properties:
      name:
        type: string
      price:
        type: integer
      quantity:
        type: integer
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/order.Item'
        type: array
      status:
        $ref: '#/definitions/order.Status'
      total_price:
        type: integer
    type: object
  order.Status:
    enum:
    - new
    - processing
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusNew
    - StatusProcessing
    - StatusCompleted
    - StatusCancelled
  order.StatusChange:
    properties:
      changed_at:
        type: string
      status:
        $ref: '#/definitions/order.Status'
    type: object
  order.UpdateStatusInput:
    properties:
      status:
        $ref: '#/definitions/order.Status'
    type: object
info:
  contact: {}
  description: REST API for creating and retrieving orders, updating their statuses,
    and viewing status history
  title: Orders API
  version: "1.0"
paths:
  /api/v1/orders:
    get:
      description: Return all orders sorted by creation time
      produces:
      - application/json
      responses:
        "200":
          description: Orders
          schema:
            items:
              $ref: '#/definitions/order.Order'
            type: array
        "500":
          description: Internal server error (INTERNAL_ERROR)
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: List orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Create order with status new and calculate total price
      parameters:
      - description: Items in order
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Order created
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Invalid JSON (INVALID_JSON) or invalid order (INVALID_ORDER)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error (INTERNAL_ERROR)
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create order
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      description: Return order by its ID
      parameters:
      - description: Order ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order found
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Invalid order ID (INVALID_ID)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Order not found (ORDER_NOT_FOUND)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error (INTERNAL_ERROR)
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get order by ID
      tags:
      - orders
  /api/v1/orders/{id}/history:
    get:
      description: Return status changes in chronological order
      parameters:
      - description: Order ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Order history
          schema:
            items:
              $ref: '#/definitions/order.StatusChange'
            type: array
        "400":
          description: Invalid order ID (INVALID_ID)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Order not found (ORDER_NOT_FOUND)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error (INTERNAL_ERROR)
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get order history
      tags:
      - orders
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: 'Allowed transitions: new to processing or cancelled; processing
        to completed or cancelled. Completed and cancelled are final statuses.'
      parameters:
      - description: Order ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: New order status
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/order.UpdateStatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: Order updated
          schema:
            $ref: '#/definitions/order.Order'
        "400":
          description: Invalid ID (INVALID_ID), JSON (INVALID_JSON) or status (INVALID_STATUS)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Order not found (ORDER_NOT_FOUND)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Status transition is not allowed (INVALID_STATUS_TRANSITION)
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error (INTERNAL_ERROR)
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Update order status
      tags:
      - orders
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'Service status: status = ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check service health
      tags:
      - health
swagger: "2.0"
